name: 每天更新羽球團資料

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 台灣時間 07:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓資料（含新場館座標，每次最多查 120 個）
        env:
          GEOCODE_LIMIT: "120"
        run: python3 scripts/fetch.py

      - name: 有變動才 commit
        run: |
          if git diff --quiet -- data/; then
            echo "資料沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "每日更新羽球團資料 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          git push
